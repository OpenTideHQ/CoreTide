name: Framework Generation Pipeline

on:
  workflow_call:
    inputs:
      coretide_repo:
        type: string
        description: "GitHub repository (owner/name) to clone CoreTide from"
        required: false
        default: OpenTideHQ/CoreTide
      coretide_path:
        type: string
        description: "Path where CoreTide needs to be cloned into"
        required: false
        default: coretide
      coretide_ref:
        type: string
        description: "Ref to clone CoreTide from"
        required: false
        default: development
      python_version:
        type: string
        description: "Python version to use"
        required: false
        default: "3.12"
      requirements_file:
        type: string
        description: "Requirements file path"
        required: false
        default: "coretide/Engines/requirements.txt"
      opentide_secrets:
        type: string
        description: "Content of the OpenTide secrets file"
        required: false
    secrets:
      github_app_id:
        description: "GitHub App ID used to push framework commits when the default branch is protected. Optional; falls back to GITHUB_TOKEN. Add this App to the branch ruleset bypass list. GITHUB_TOKEN cannot bypass required pull requests or status checks."
        required: false
      github_app_private_key:
        description: "GitHub App private key (PEM) used with github_app_id"
        required: false

jobs:
  Framework:
    name: Framework Generation
    runs-on: ubuntu-latest
    concurrency:
      group: framework
      cancel-in-progress: false
    env:
      HAS_GITHUB_APP: ${{ secrets.github_app_id && secrets.github_app_private_key && 'true' || 'false' }}
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}

      - name: Checkout Tide Instance
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: ${{ github.ref }}
          token: ${{ steps.generate_token.outputs.token || github.token }}

      - name: Checkout CoreTide
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.coretide_repo }}
          path: ${{ inputs.coretide_path }}
          ref: refs/heads/${{ inputs.coretide_ref }}

      - uses: ./coretide/Pipelines/GitHub/tide-setup
        name: Tide Setup
        id: tide_setup
        with:
          python_version: ${{ inputs.python_version }}
          requirements_file: ${{ inputs.requirements_file }}
          opentide_secrets: ${{ inputs.opentide_secrets }}

      - uses: ./coretide/Pipelines/GitHub/framework
        name: Framework Setup
        id: framework_setup
        with:
          coretide_path: ${{ inputs.coretide_path }}
