name: Deployment

on:
  workflow_call:
    inputs:
      coretide_repo:
        type: string
        description: "GitHub repository (owner/name) to clone CoreTide from"
        required: false
        default: OpenTideHQ/CoreTide
      coretide_path:
        type: string
        description: "Path where CoreTide needs to be cloned into"
        required: false
        default: coretide
      coretide_ref:
        type: string
        description: "Ref to clone CoreTide from"
        required: false
        default: development
      python_version:
        type: string
        description: "Python version to use"
        required: false
        default: "3.12"
      requirements_file:
        type: string
        description: "Requirements file path"
        required: false
        default: "coretide/Engines/requirements.txt"
      opentide_secrets:
        type: string
        description: "Content of the OpenTide secrets file"
        required: false
    # Tide instance main.yml (same mapping as Documentation):
    #   secrets:
    #     github_app_id: ${{ secrets.GH_APP_ID }}
    #     github_app_private_key: ${{ secrets.GH_APP_KEY }}
    secrets:
      github_app_id:
        description: "GitHub App ID used to push MDR promotion commits when the default branch is protected. Optional; falls back to GITHUB_TOKEN. Install the App on this Tide instance with Contents: write and add it to the branch ruleset bypass list. GITHUB_TOKEN cannot bypass required pull requests or status checks."
        required: false
      github_app_private_key:
        description: "GitHub App private key (PEM) used with github_app_id"
        required: false

jobs:
  StagingDeployment:
    name: Staging Deployment
    runs-on: ubuntu-latest
    if: ${{github.event_name == 'pull_request'}}
    steps:
      - name: Checkout Tide Instance
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: ${{ github.ref }}

      - name: Checkout CoreTide
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.coretide_repo }}
          path: ${{ inputs.coretide_path }}
          ref: refs/heads/${{ inputs.coretide_ref }}

      - name: Tide Setup
        uses: ./coretide/Pipelines/GitHub/tide-setup
        id: tide_setup
        with:
          python_version: ${{ inputs.python_version }}
          requirements_file: ${{ inputs.requirements_file }}
          opentide_secrets: ${{ inputs.opentide_secrets }}

      - uses: ./coretide/Pipelines/GitHub/deployment
        name: Deployment Routine
        id: deployment_routine
        with:
          deployment_plan: STAGING

  ProductionDeployment:
    name: Production Deployment
    runs-on: ubuntu-latest
    env:
      HAS_GITHUB_APP: ${{ secrets.github_app_id && secrets.github_app_private_key && 'true' || 'false' }}
    if: ${{github.ref_name == github.event.repository.default_branch}}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout Tide Instance
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}
          token: ${{ steps.generate_token.outputs.token || github.token }}
          persist-credentials: true

      - name: Checkout CoreTide
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.coretide_repo }}
          path: ${{ inputs.coretide_path }}
          ref: refs/heads/${{ inputs.coretide_ref }}
          persist-credentials: false

      - name: Tide Setup
        uses: ./coretide/Pipelines/GitHub/tide-setup
        id: tide_setup
        with:
          python_version: ${{ inputs.python_version }}
          requirements_file: ${{ inputs.requirements_file }}
          opentide_secrets: ${{ inputs.opentide_secrets }}

      - uses: ./coretide/Pipelines/GitHub/deployment
        name: Deployment Routine
        id: deployment_routine
        with:
          deployment_plan: PRODUCTION
          coretide_path: ${{ inputs.coretide_path }}
